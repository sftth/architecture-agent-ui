<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!--
    Agent 미니미 파츠 시트 - 16 x 24 픽셀 그리드(캐릭터 16 x 21, 위 3행은 머리 위 소품).
    원본 킷(Downloads/architecture agent minime/sprites.svg)에 머리 4종·표정 3종·손 3종·소품 2종을 더했다.
    색은 전부 CSS 변수다. 셔츠(--shirt --arm --zip)는 부서색, 머리(--hair)·피부(--skin)는 사람마다.
    소품 색은 원본의 하드코딩을 우리 토큰으로 바꿨다 - 합격은 mint, 실패는 rose, 나머지는 paper.
    docs/design/agent-minime.md §5.2
  -->
  <defs>
    <!-- 머리 5종 -->
    <g id="h-short" shape-rendering="crispEdges"><path fill="var(--hair,#4A2E1C)" d="M5 0h6v1h-6zM4 1h8v1h-8zM3 2h10v2h-10zM3 4h3v1h-3zM10 4h3v1h-3zM3 5h1v1h-1zM12 5h1v1h-1z"/></g>
    <g id="h-bob"   shape-rendering="crispEdges"><path fill="var(--hair,#4A2E1C)" d="M5 0h6v1h-6zM4 1h8v1h-8zM3 2h10v2h-10zM3 4h3v1h-3zM10 4h3v1h-3zM3 5h1v4h-1zM12 5h1v4h-1z"/></g>
    <g id="h-long"  shape-rendering="crispEdges"><path fill="var(--hair,#4A2E1C)" d="M5 0h6v1h-6zM4 1h8v1h-8zM3 2h10v2h-10zM3 4h3v1h-3zM10 4h3v1h-3zM3 5h1v7h-1zM12 5h1v7h-1z"/></g>
    <g id="h-spiky" shape-rendering="crispEdges"><path fill="var(--hair,#4A2E1C)" d="M4 0h1v1h-1zM6 0h1v1h-1zM8 0h1v1h-1zM10 0h1v1h-1zM4 1h8v1h-8zM3 2h10v2h-10zM3 4h1v1h-1zM12 4h1v1h-1z"/></g>
    <g id="h-buzz"  shape-rendering="crispEdges"><path fill="var(--hair,#4A2E1C)" d="M5 1h6v1h-6zM4 2h8v2h-8zM4 4h1v1h-1zM11 4h1v1h-1z"/></g>

    <!-- 얼굴·목·손 -->
    <g id="m-head-skin" shape-rendering="crispEdges"><path fill="var(--skin,#F5CBA7)" d="M6 4h4v1h-4zM4 5h8v4h-8zM5 9h6v1h-6z"/><path fill="var(--blush,#F28C8C)" opacity=".7" d="M4 8h1v1h-1zM11 8h1v1h-1z"/></g>
    <g id="m-neck-hands" shape-rendering="crispEdges"><path fill="var(--skin,#F5CBA7)" d="M7 10h2v1h-2zM3 17h1v1h-1zM12 17h1v1h-1z"/></g>
    <g id="m-neck" shape-rendering="crispEdges"><path fill="var(--skin,#F5CBA7)" d="M7 10h2v1h-2z"/></g>
